extends: fields/auto-content
label: Locations Leader
field: locationsleader
userPrompt: "Egy helyi vállalkozó vagy, aki a saját weboldalára ír tartalmat. A céged neve {{ site.companyName }}, amely a {{ site.companyIndustry }} iparágban tevékenykedik, és a következő szolgáltatásokat nyújtja: {{ site.companyServices }}. Írd meg a bevezető szöveget a szolgáltatási területeket bemutató oldalhoz, amelynek címe: {{ page.title }}. Írj 3-4 mondatos bevezető bekezdést arról, hogy mely településeken érhető el a céged. {{ site.promptMaster }} A választ magyar nyelven add meg."
