tabs:

  page:
    icon: page
    columns:

      sidebar:
        width: 1/4
        sections:

          leader:
            extends: sections/pages/leader
          auto-leader:
            extends: prompts/article/auto-leader
          auto-intro:
            extends: prompts/article/auto-intro
          auto-text:
            extends: prompts/article/auto-text

          meta:
            type: fields
