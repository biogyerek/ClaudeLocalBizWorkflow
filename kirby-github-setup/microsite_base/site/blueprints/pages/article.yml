              date:
                label: Dátum
                type: date
                default: today
                time: false
              tags:
                label: Címkék
                type: tags

      main:
        width: 3/4
        sections:

          text:
            extends: sections/pages/text

  knowledge: tabs/knowledge
  files: tabs/files
  seo: seo/page